<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fingerprint Clock In/Out</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    .status { margin-top: 1em; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Fingerprint Clock In/Out</h1>
  <div>
    <label for="schedule_id">Schedule ID:</label>
    <input type="number" id="schedule_id" value="1" min="1">
  </div>
  <div style="margin-top:1em;">
    <button id="clock_in">Clock In</button>
    <button id="clock_out">Clock Out</button>
  </div>
  <div id="fp-status" class="status"></div>
  <div id="bridge-status" class="status"></div>
  <script src="../assets/js/fingerprint-scanner.js"></script>
  <script>
    // Minimal bridge connection check
    let bridgeConnected = false;
    window.addEventListener('bridge-status', function(e) {
      bridgeConnected = e.detail.connected;
      document.getElementById('bridge-status').textContent = bridgeConnected ? 'Bridge: Connected' : 'Bridge: Not connected';
      document.getElementById('bridge-status').className = 'status ' + (bridgeConnected ? 'success' : 'error');
    });

    async function scanAndClock(action) {
      document.getElementById('fp-status').textContent = 'Place your finger on the scanner...';
      document.getElementById('fp-status').className = 'status';
      if (!bridgeConnected) {
        document.getElementById('fp-status').textContent = 'Bridge not connected!';
        document.getElementById('fp-status').className = 'status error';
        return;
      }
      // Use the scanner API
      if (window.FingerprintScanner) {
        try {
          const result = await window.FingerprintScanner.enroll();
          if (!result.success || !result.template || result.template.length < 20) {
            document.getElementById('fp-status').textContent = 'Scan failed or template too short.';
            document.getElementById('fp-status').className = 'status error';
            return;
          }
          // Send to backend for clock in/out
          const scheduleId = document.getElementById('schedule_id').value;
          const res = await fetch('clock.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `schedule_id=${encodeURIComponent(scheduleId)}&action=${action}&fingerprint_template=${encodeURIComponent(result.template)}`
          });
          const data = await res.json();
          if (data.success) {
            document.getElementById('fp-status').textContent = (action === 'in' ? 'Clock In' : 'Clock Out') + ' successful!';
            document.getElementById('fp-status').className = 'status success';
          } else {
            document.getElementById('fp-status').textContent = data.message || 'Error.';
            document.getElementById('fp-status').className = 'status error';
          }
        } catch (e) {
          document.getElementById('fp-status').textContent = 'Error: ' + e.message;
          document.getElementById('fp-status').className = 'status error';
        }
      } else {
        document.getElementById('fp-status').textContent = 'Fingerprint scanner not available.';
        document.getElementById('fp-status').className = 'status error';
      }
    }
    document.getElementById('clock_in').onclick = () => scanAndClock('in');
    document.getElementById('clock_out').onclick = () => scanAndClock('out');
  </script>
</body>
</html>
